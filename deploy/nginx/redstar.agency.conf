# redstar.agency — сайт агентства, статика из /var/www/redstar-agency.
# redstaragency.ru — прежний адрес, весь уводится сюда 301 (второй server ниже).
# Боевые домены, открыты для поиска: X-Robots-Tag и noindex здесь НЕ ставить
# (правило «закрыто от индексации» — только для демо-поддоменов).
# Поддомены обоих доменов живут на других серверах и этим конфигом не обслуживаются.
# Строки «managed by Certbot» дописал certbot 29.10.2026; сертификат redstar.agency на все четыре имени
# продлевается сам. Это копия конфига с сервера — правки сначала на сервере, потом сюда.
server {
    server_name redstar.agency www.redstar.agency;

    root /var/www/redstar-agency;
    index index.html;
    charset utf-8;

    # Один адрес сайта — без www.
    if ($host = www.redstar.agency) {
        return 301 https://redstar.agency$request_uri;
    }

    # Главная одна: /index.html → /. Проверка по $request_uri, а не location:
    # иначе внутренний переход index на /index.html зациклится.
    if ($request_uri ~ ^/index\.html(?:\?|$)) {
        return 301 /$is_args$args;
    }

    # Адреса старого сайта на Тильде.
    location ~ ^/(?:support|security|aspro)/?$ { return 301 /uslugi-podderzhka.html; }
    location ~ ^/(?:politica|suppolicy)/?$ { return 301 /privacy.html; }
    location ~ ^/obrabotka/?$ { return 301 /obrabotka.html; }
    location ~ ^/(?:copy|secthanks|supthanks)/?$ { return 301 /; }

    # Страницы-заглушки с meta refresh — сразу 301.
    location = /blog.html { return 301 /zhurnal.html; }
    location = /keys-podmoskovie.html { return 301 /keys-fid-vrachey.html; }
    location = /keys-psm.html { return 301 /keysy.html; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Стили и скрипты в основном без ?v= — браузер сверяется с сервером при каждом заходе
    # (ответ 304, если не менялись), иначе после выкладки покажет старую вёрстку.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/redstar.agency/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/redstar.agency/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# Прежний адрес. Переадресация внутри location, а не на уровне server: certbot подкладывает
# проверку домена точным location, и server-level return её перехватил бы.
server {
    server_name redstaragency.ru www.redstaragency.ru;

    # Адреса Тильды — сразу на итоговую страницу, без цепочки переадресаций.
    location ~ ^/(?:support|security|aspro)/?$ { return 301 https://redstar.agency/uslugi-podderzhka.html; }
    location ~ ^/(?:politica|suppolicy)/?$ { return 301 https://redstar.agency/privacy.html; }
    location ~ ^/obrabotka/?$ { return 301 https://redstar.agency/obrabotka.html; }
    location ~ ^/(?:copy|secthanks|supthanks)/?$ { return 301 https://redstar.agency/; }

    location / {
        return 301 https://redstar.agency$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/redstar.agency/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/redstar.agency/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.redstar.agency) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = redstar.agency) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name redstar.agency www.redstar.agency;
    return 404; # managed by Certbot




}
