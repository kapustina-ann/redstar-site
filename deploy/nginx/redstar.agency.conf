# Match the client's original request, including before an internal HTML lookup.
map $request_uri $redstar_redirect {
    default "";
    ~^/index(?:\.html)?/?(?:\?|$) /;
    ~^/(?:support|security|aspro)/?(?:\?|$) /uslugi-podderzhka;
    ~^/(?:politica|suppolicy)/?(?:\?|$) /privacy;
    ~^/(?:copy|secthanks|supthanks)/?(?:\?|$) /;
    ~^/blog(?:\.html)?/?(?:\?|$) /zhurnal;
    ~^/keys-podmoskovie(?:\.html)?/?(?:\?|$) /keys-fid-vrachey;
    ~^/keys-psm(?:\.html)?/?(?:\?|$) /keysy;
    ~^/(?<redstar_page>[a-z0-9-]+)(?:\.html|/)(?:\?|$) /$redstar_page;
}
# redstar.agency — сайт агентства, статика из /var/www/redstar-agency.
# redstaragency.ru — прежний адрес, весь уводится сюда 301 (второй server ниже).
# Боевые домены, открыты для поиска: X-Robots-Tag и noindex здесь НЕ ставить
# (правило «закрыто от индексации» — только для демо-поддоменов).
# Поддомены обоих доменов живут на других серверах и этим конфигом не обслуживаются.
# Блоки 443 и переадресацию с http допишет certbot после переключения DNS:
#   sudo certbot --nginx --cert-name redstar.agency -d redstar.agency -d www.redstar.agency -d redstaragency.ru -d www.redstaragency.ru
server {
    if ($redstar_redirect) { return 301 https://redstar.agency$redstar_redirect$is_args$args; }
    server_name redstar.agency www.redstar.agency;

    root /var/www/redstar-agency;
    index index.html;
    charset utf-8;

    # Один адрес сайта — без www.
    if ($host = www.redstar.agency) {
        return 301 https://redstar.agency$request_uri;
    }

    location = / { try_files /index.html =404; }
    location ~ ^/[a-z0-9-]+$ { try_files $uri.html =404; }
    location / { try_files $uri =404; }

    # Стили и скрипты в основном без ?v= — браузер сверяется с сервером при каждом заходе
    # (ответ 304, если не менялись), иначе после выкладки покажет старую вёрстку.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/redstar.agency/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/redstar.agency/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# Прежний адрес. Переадресация внутри location, а не на уровне server: certbot подкладывает
# проверку домена точным location, и server-level return её перехватил бы.
server {
    if ($redstar_redirect) { return 301 https://redstar.agency$redstar_redirect$is_args$args; }
    server_name redstaragency.ru www.redstaragency.ru;

    location / {
        return 301 https://redstar.agency$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/redstar.agency/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/redstar.agency/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($redstar_redirect) { return 301 https://redstar.agency$redstar_redirect$is_args$args; }
    if ($host = www.redstar.agency) {
        return 301 https://redstar.agency$request_uri;
    } # managed by Certbot


    if ($host = redstar.agency) {
        return 301 https://redstar.agency$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name redstar.agency www.redstar.agency;
    return 404; # managed by Certbot




}
