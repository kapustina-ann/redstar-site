# redstaragency.ru — сайт агентства, статика из /var/www/redstaragency.
# Боевой домен, открыт для поиска: X-Robots-Tag и noindex здесь НЕ ставить
# (правило «закрыто от индексации» — только для демо-поддоменов).
# Блоки 443 и переадресацию с http допишет certbot после переключения DNS:
#   sudo certbot --nginx -d redstaragency.ru -d www.redstaragency.ru
server {
    listen 80;
    listen [::]:80;
    server_name redstaragency.ru www.redstaragency.ru;

    root /var/www/redstaragency;
    index index.html;
    charset utf-8;

    # Один адрес сайта — без www.
    if ($host = www.redstaragency.ru) {
        return 301 https://redstaragency.ru$request_uri;
    }

    # Главная одна: /index.html → /. Проверка по $request_uri, а не location:
    # иначе внутренний переход index на /index.html зациклится.
    if ($request_uri ~ ^/index\.html(?:\?|$)) {
        return 301 /$is_args$args;
    }

    # Адреса старого сайта на Тильде.
    location ~ ^/(?:support|security|aspro)/?$ { return 301 /uslugi-podderzhka.html; }
    location ~ ^/(?:politica|suppolicy)/?$ { return 301 /privacy.html; }
    location ~ ^/obrabotka/?$ { return 301 /obrabotka.html; }
    location ~ ^/(?:copy|secthanks|supthanks)/?$ { return 301 /; }

    # Страницы-заглушки с meta refresh — сразу 301.
    location = /blog.html { return 301 /zhurnal.html; }
    location = /keys-podmoskovie.html { return 301 /keys-fid-vrachey.html; }
    location = /keys-psm.html { return 301 /keysy.html; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Стили и скрипты в основном без ?v= — браузер сверяется с сервером при каждом заходе
    # (ответ 304, если не менялись), иначе после выкладки покажет старую вёрстку.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml;
}
